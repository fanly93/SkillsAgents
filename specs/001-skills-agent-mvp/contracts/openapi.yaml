openapi: 3.1.0
info:
  title: SkillsAgents MVP API
  version: 0.1.0
  description: REST contract for the Skills Agent runnable MVP.
servers:
  - url: http://localhost:8000
paths:
  /v1/sessions:
    post:
      summary: Create a tenant-scoped session
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "404":
          description: Unknown tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/chat:
    post:
      summary: Send one tenant-scoped chat turn
      operationId: chatTurn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Chat turn processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Invalid request, disabled skill, unsafe skill reference, or failed handoff trigger input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Session does not belong to the requested user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown tenant or session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/tasks/{session_id}:
    get:
      summary: Retrieve a tenant-scoped task checklist
      operationId: getTasks
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task checklist returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          description: Invalid tenant identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown tenant or session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/skills:
    get:
      summary: List skills enabled for a tenant
      operationId: listSkills
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant skills returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillListResponse"
        "404":
          description: Unknown tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/skills/reload:
    post:
      summary: Reload local skill sources for a tenant
      operationId: reloadSkills
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReloadSkillsRequest"
      responses:
        "200":
          description: Tenant skills reloaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillReloadResponse"
        "404":
          description: Unknown tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/health:
    get:
      summary: Return service and provider health
      operationId: getHealth
      responses:
        "200":
          description: Health status returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  schemas:
    CreateSessionRequest:
      type: object
      required:
        - tenant_id
        - user_id
      properties:
        tenant_id:
          type: string
        user_id:
          type: string
        metadata:
          type: object
          description: Optional per-turn metadata. The MVP recognizes `tool_failed: true` as a Human-in-the-loop trigger.
          additionalProperties: true
    SessionResponse:
      type: object
      required:
        - tenant_id
        - user_id
        - session_id
        - status
      properties:
        tenant_id:
          type: string
        user_id:
          type: string
        session_id:
          type: string
        status:
          type: string
          enum: [active, handoff_required, closed]
    ChatRequest:
      type: object
      required:
        - tenant_id
        - user_id
        - session_id
        - message
      properties:
        tenant_id:
          type: string
        user_id:
          type: string
        session_id:
          type: string
        message:
          type: string
          minLength: 1
        skill_id:
          type: string
        skill_name:
          type: string
        metadata:
          type: object
          additionalProperties: true
    ChatResponse:
      type: object
      required:
        - tenant_id
        - session_id
        - reply
        - activated_skills
        - task_summary
        - sources
        - risk_level
        - risk_tags
        - handoff_required
      properties:
        tenant_id:
          type: string
        session_id:
          type: string
        reply:
          type: string
        activated_skills:
          type: array
          items:
            $ref: "#/components/schemas/ActivatedSkill"
        task_summary:
          $ref: "#/components/schemas/TaskSummary"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceReference"
        risk_level:
          type: string
          enum: [low, medium, high, blocked]
        risk_tags:
          type: array
          items:
            type: string
        handoff_required:
          type: boolean
        requires_human_approval:
          type: boolean
        approval_request:
          $ref: "#/components/schemas/ApprovalRequest"
        handoff_payload_path:
          type: string
    ActivatedSkill:
      type: object
      required:
        - skill_id
        - name
        - selection_reason
      properties:
        skill_id:
          type: string
        name:
          type: string
        version:
          type: string
        checksum:
          type: string
        selection_reason:
          type: string
          enum: [explicit, keyword, fallback]
    TaskSummary:
      type: object
      required:
        - total
        - completed
        - failed
        - pending
      properties:
        total:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
    SourceReference:
      type: object
      required:
        - source_id
        - title
        - snippet
      properties:
        source_id:
          type: string
        title:
          type: string
        path:
          type: string
        snippet:
          type: string
        score:
          type: number
    ApprovalRequest:
      type: object
      properties:
        reason:
          type: string
        risk_tags:
          type: array
          items:
            type: string
        recommended_next_steps:
          type: array
          items:
            type: string
    TaskResponse:
      type: object
      required:
        - tenant_id
        - session_id
        - markdown
        - summary
      properties:
        tenant_id:
          type: string
        session_id:
          type: string
        markdown:
          type: string
        summary:
          $ref: "#/components/schemas/TaskSummary"
    SkillListResponse:
      type: object
      required:
        - tenant_id
        - skills
      properties:
        tenant_id:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillEntry"
    SkillEntry:
      type: object
      required:
        - skill_id
        - name
        - description
        - source
        - enabled
      properties:
        skill_id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        source:
          type: string
        enabled:
          type: boolean
        checksum:
          type: string
        warnings:
          type: array
          items:
            type: string
    ReloadSkillsRequest:
      type: object
      required:
        - tenant_id
      properties:
        tenant_id:
          type: string
    SkillReloadResponse:
      type: object
      required:
        - tenant_id
        - scanned
        - registered
        - warnings
      properties:
        tenant_id:
          type: string
        scanned:
          type: integer
          minimum: 0
        registered:
          type: integer
          minimum: 0
        warnings:
          type: array
          items:
            type: string
    HealthResponse:
      type: object
      required:
        - status
        - providers
      properties:
        status:
          type: string
          enum: [ok, degraded]
        providers:
          type: object
          additionalProperties:
            type: string
    ErrorResponse:
      type: object
      description: >
        Standard error response. Common MVP error codes include
        `unknown_tenant`, `session_not_found`, `session_user_mismatch`,
        `skill_not_enabled`, `invalid_tenant_id`, and `task_not_found`.
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
